{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4">Create an Account</h2>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" placeholder="example@mail.com" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" placeholder="Your nickname" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="At least 6 characters" required>
          </div>
          <div class="d-grid">
            <button class="btn btn-success btn-lg">Register</button>
          </div>
        </form>
        <hr>
        <p class="text-center mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
