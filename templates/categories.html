{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Categories</h2>
  <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>

<form method="post" class="mb-4">
  <div class="input-group" style="max-width:400px;">
    <input name="name" class="form-control" placeholder="New category name" required>
    <button class="btn btn-primary">Add</button>
  </div>
</form>

{% if categories %}
<ul class="list-group" style="max-width:400px;">
  {% for c in categories %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    <span>{{ c.name }}</span>
    <form method="post" action="{{ url_for('category_delete', cat_id=c.id) }}" style="margin:0;">
      <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete category {{ c.name }}? Recipes will remain but lose their category.')">✕</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
  <div class="alert alert-info" style="max-width:400px;">No categories yet.</div>
{% endif %}

{% endblock %}
