{% extends "base.html" %}
{% block title %}{% if recipe %}Edit Recipe{% else %}Add Recipe{% endif %}{% endblock %}
{% block content %}

<h2>{% if recipe %}Edit Recipe{% else %}Add New Recipe{% endif %}</h2>
<form method="post" enctype="multipart/form-data" class="mt-3" style="max-width:700px;">
  <div class="mb-3">
    <label class="form-label fw-bold">Title</label>
    <input name="title" class="form-control" value="{{ recipe.title if recipe else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label fw-bold">Ingredients <span class="text-muted fw-normal">(comma-separated)</span></label>
    <input name="ingredients" class="form-control" value="{{ recipe.ingredients if recipe else '' }}" placeholder="egg, tomato, cheese" required>
  </div>
  <div class="mb-3">
    <label class="form-label fw-bold">Instructions</label>
    <textarea name="instructions" class="form-control" rows="6" required>{{ recipe.instructions if recipe else '' }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label fw-bold">Category</label>
    <select name="category" class="form-select">
      <option value="">— None —</option>
      {% for c in categories %}
        <option value="{{ c.id }}" {% if recipe and recipe.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label fw-bold">Photo <span class="text-muted fw-normal">(optional)</span></label>
    <input type="file" name="image" class="form-control" accept="image/*">
    {% if recipe and recipe.image_path %}
      <img src="/{{ recipe.image_path }}" style="max-width:180px;margin-top:8px;" class="rounded">
    {% endif %}
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-success">Save</button>
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>

{% endblock %}
