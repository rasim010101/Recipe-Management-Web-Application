{% extends "base.html" %}
{% block title %}Forgot Password — RecipeHub{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🔑</div>
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
    </div>

    <form method="post" id="forgotForm" novalidate>
      <div class="form-group-modern">
        <label class="form-label-modern">Email address</label>
        <input name="email" type="email" id="forgotEmail" class="form-input"
               placeholder="you@example.com" required autofocus>
        <div class="field-error" id="forgotEmailErr">Please enter a valid email address.</div>
      </div>
      <button type="submit" class="btn-submit" id="forgotBtn">Send Reset Link →</button>
    </form>

    <div class="auth-divider"><span>or</span></div>
    <p class="auth-link-row">
      Remembered it? <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('forgotForm').addEventListener('submit', function(e) {
  const email = document.getElementById('forgotEmail');
  const ok    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  email.classList.toggle('is-invalid', !ok);
  document.getElementById('forgotEmailErr').classList.toggle('visible', !ok);
  if (!ok) { e.preventDefault(); return; }
  document.getElementById('forgotBtn').textContent = 'Sending…';
  document.getElementById('forgotBtn').disabled = true;
});
</script>
{% endblock %}
