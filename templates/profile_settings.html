{% extends "base.html" %}
{% block title %}Profile Settings{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="mb-4">⚙ Profile Settings</h2>
        <form method="post" enctype="multipart/form-data">

          <div class="mb-4">
            <label class="form-label fw-bold">Profile Photo</label>
            <div class="d-flex align-items-center gap-3 mb-2">
              {% if current_user.avatar_path %}
                <img src="/{{ current_user.avatar_path }}" id="avatarPreview"
                     class="rounded-circle" style="width:80px;height:80px;object-fit:cover;">
              {% else %}
                <div id="avatarPreview" class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center"
                     style="width:80px;height:80px;font-size:2rem;">
                  {{ current_user.username[0].upper() }}
                </div>
              {% endif %}
              <div>
                <input type="file" name="avatar" class="form-control" accept="image/*" id="avatarInput">
                <small class="text-muted">JPG, PNG, GIF — max 2 MB</small>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Username</label>
            <input name="username" class="form-control" value="{{ current_user.username }}" required>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('profile', username=current_user.username) }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
// Live preview of selected avatar
document.getElementById('avatarInput').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const preview = document.getElementById('avatarPreview');
    preview.outerHTML = `<img src="${e.target.result}" id="avatarPreview" class="rounded-circle"
      style="width:80px;height:80px;object-fit:cover;">`;
  };
  reader.readAsDataURL(file);
});
</script>

{% endblock %}
