{% extends "base.html" %}
{% block title %}Reset Password — RecipeHub{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🔐</div>
      <h1 class="auth-title">Set new password</h1>
      <p class="auth-subtitle">Choose a strong password for your account</p>
    </div>

    <form method="post" id="resetForm" novalidate>
      <div class="form-group-modern">
        <label class="form-label-modern">New Password</label>
        <div class="pwd-wrap">
          <input name="password" type="password" id="resetPwd" class="form-input"
                 placeholder="At least 6 characters" required minlength="6">
          <button type="button" class="pwd-toggle" data-target="resetPwd" title="Show/hide">👁</button>
        </div>
        <div class="field-error" id="resetPwdErr">Password must be at least 6 characters.</div>
        <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="resetStrengthFill"></div></div>
        <div class="pwd-strength-label" id="resetStrengthLabel"></div>
      </div>

      <div class="form-group-modern">
        <label class="form-label-modern">Confirm New Password</label>
        <div class="pwd-wrap">
          <input name="confirm_password" type="password" id="resetConfirm" class="form-input"
                 placeholder="Repeat new password" required>
          <button type="button" class="pwd-toggle" data-target="resetConfirm" title="Show/hide">👁</button>
        </div>
        <div class="field-error" id="resetConfirmErr">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn-submit" id="resetBtn">Update Password →</button>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
// Password strength (same logic as register)
const pwdInput = document.getElementById('resetPwd');
const fill     = document.getElementById('resetStrengthFill');
const label    = document.getElementById('resetStrengthLabel');
const LEVELS   = [
  { label: 'Too short',  color: '#EF4444', pct: 15 },
  { label: 'Weak',       color: '#F97316', pct: 35 },
  { label: 'Fair',       color: '#F59E0B', pct: 60 },
  { label: 'Good',       color: '#84CC16', pct: 80 },
  { label: 'Strong',     color: '#22C55E', pct: 100 },
];
function pwdScore(v) {
  if (v.length < 6) return 0;
  let s = 1;
  if (v.length >= 10) s++;
  if (/[A-Z]/.test(v)) s++;
  if (/[0-9]/.test(v)) s++;
  if (/[^A-Za-z0-9]/.test(v)) s++;
  return Math.min(s, 4);
}
pwdInput.addEventListener('input', () => {
  const v = pwdInput.value;
  if (!v) { fill.style.width = '0'; label.textContent = ''; return; }
  const lvl = LEVELS[pwdScore(v)];
  fill.style.width = lvl.pct + '%';
  fill.style.background = lvl.color;
  label.textContent = lvl.label;
  label.style.color = lvl.color;
});

// Show/hide toggles
document.querySelectorAll('.pwd-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = document.getElementById(btn.dataset.target);
    inp.type  = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁' : '🙈';
  });
});

// Validation
document.getElementById('resetForm').addEventListener('submit', function(e) {
  let valid = true;
  const pwd     = document.getElementById('resetPwd');
  const confirm = document.getElementById('resetConfirm');

  const pwdOk = pwd.value.length >= 6;
  pwd.classList.toggle('is-invalid', !pwdOk);
  document.getElementById('resetPwdErr').classList.toggle('visible', !pwdOk);
  if (!pwdOk) valid = false;

  const matchOk = pwd.value === confirm.value && confirm.value.length > 0;
  confirm.classList.toggle('is-invalid', !matchOk);
  document.getElementById('resetConfirmErr').classList.toggle('visible', !matchOk);
  if (!matchOk) valid = false;

  if (!valid) { e.preventDefault(); return; }
  document.getElementById('resetBtn').textContent = 'Updating…';
  document.getElementById('resetBtn').disabled = true;
});

document.getElementById('resetConfirm').addEventListener('input', function() {
  const match = this.value === document.getElementById('resetPwd').value;
  this.classList.toggle('is-invalid', !match && this.value.length > 0);
  document.getElementById('resetConfirmErr').classList.toggle('visible',
    !match && this.value.length > 0);
});
</script>
{% endblock %}
